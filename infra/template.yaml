AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AERIS - data/web buckets, least-privilege roles, budget alerts, ingestion Lambdas

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Environment:
      Variables:
        AERIS_STORAGE: s3
        AERIS_S3_BUCKET: !Ref DataBucket

Parameters:
  AlertEmail:
    Type: String
    Description: Email that receives budget alerts
  MonthlyBudgetUsd:
    Type: Number
    Default: 50
    Description: Monthly cost budget in USD (alerts at 50%, 80%, 100%)
  BronzeRetentionDays:
    Type: Number
    Default: 14
  AgentModelId:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Bedrock model or inference-profile id for the Strands action agent

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub aeris-${AWS::AccountId}-data
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-bronze
            Status: Enabled
            Prefix: bronze/
            ExpirationInDays: !Ref BronzeRetentionDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub aeris-${AWS::AccountId}-web
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # --- Roles: one per function, least privilege ---------------------------
  FetcherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: fetcher
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub ${DataBucket.Arn}/bronze/*
                  - !Sub ${DataBucket.Arn}/reference/*
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FetchDlq.Arn

  ModelRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: model
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub ${DataBucket.Arn}/bronze/*
                  - !Sub ${DataBucket.Arn}/reference/*
                  - !Sub ${DataBucket.Arn}/gold/*
              # ListBucket makes a missing key a NoSuchKey (404) instead of AccessDenied
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              # Every gold/ file except actions.json, which only the agent writes
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub ${DataBucket.Arn}/gold/fires.json
                  - !Sub ${DataBucket.Arn}/gold/aqi.json
                  - !Sub ${DataBucket.Arn}/gold/wind.json
                  - !Sub ${DataBucket.Arn}/gold/sites.geojson
                  - !Sub ${DataBucket.Arn}/gold/sources.json
                  - !Sub ${DataBucket.Arn}/gold/corridor.geojson
                  - !Sub ${DataBucket.Arn}/gold/ranked_sites.json

  SageMakerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: sagemaker.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sagemaker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${DataBucket.Arn}/models/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike: {"s3:prefix": ["models/*"]}
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*

  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: agent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DataBucket.Arn}/gold/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/gold/actions.json

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DataBucket.Arn}/gold/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: [states:StartExecution, states:ListExecutions]
                Resource: !Ref PipelineStateMachine
              - Effect: Allow
                Action: states:DescribeExecution
                Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${PipelineStateMachine.Name}:*

  # --- Ingestion: fetch -> bronze/ ----------------------------------------
  FetchDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  FirmsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: fetch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/bronze/*
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FetchDlq.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:aeris/FIRMS_MAP_KEY-*

  AqiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: fetch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/bronze/*
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FetchDlq.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:aeris/OPENAQ_API_KEY-*
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:aeris/DATA_GOV_IN_KEY-*

  WeatherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: fetch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/bronze/*
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FetchDlq.Arn

  FirmsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambda/
      Handler: ingest.firms.handler.lambda_handler
      Role: !GetAtt FirmsRole.Arn
      MemorySize: 256
      Timeout: 120
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt FetchDlq.Arn
      EventInvokeConfig:
        MaximumRetryAttempts: 1
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)
            # 48 h window so bronze/fires/latest is not empty before the day's first satellite pass (UTC date rollover)
            Input: '{"day_range": 2}'

  AqiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambda/
      Handler: ingest.aqi.handler.lambda_handler
      Role: !GetAtt AqiRole.Arn
      MemorySize: 256
      Timeout: 300
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt FetchDlq.Arn
      EventInvokeConfig:
        MaximumRetryAttempts: 1
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(30 minutes)

  WeatherFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambda/
      Handler: ingest.weather.handler.lambda_handler
      Role: !GetAtt WeatherRole.Arn
      MemorySize: 512
      Timeout: 300
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt FetchDlq.Arn
      EventInvokeConfig:
        MaximumRetryAttempts: 1
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(60 minutes)

  SitesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambda/
      Handler: ingest.sites.handler.lambda_handler
      Role: !GetAtt FetcherRole.Arn
      MemorySize: 256
      Timeout: 300
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt FetchDlq.Arn
      EventInvokeConfig:
        MaximumRetryAttempts: 1

  # --- Pipeline: bronze/ + reference/ -> gold/ ----------------------------
  PublishFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambda/
      Handler: pipeline.steps.publish_handler
      Role: !GetAtt ModelRole.Arn
      MemorySize: 512
      Timeout: 120

  DetectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambda/
      Handler: pipeline.steps.detect_handler
      Role: !GetAtt ModelRole.Arn
      MemorySize: 512
      Timeout: 120

  CorridorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambda/
      Handler: pipeline.steps.corridor_handler
      Role: !GetAtt ModelRole.Arn
      MemorySize: 1024
      Timeout: 180

  RankFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambda/
      Handler: pipeline.steps.rank_handler
      Role: !GetAtt ModelRole.Arn
      MemorySize: 2048
      Timeout: 300

  AgentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambda/
      Handler: pipeline.steps.agent_handler
      Role: !GetAtt AgentRole.Arn
      MemorySize: 1024
      # Strands agent runs take 30-60 s; leave room for Bedrock retries
      Timeout: 300
      Environment:
        Variables:
          AGENT_MODEL_PROVIDER: bedrock
          AGENT_MODEL_ID: !Ref AgentModelId

  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub ${AWS::StackName}-pipeline
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy: {FunctionName: !Ref PublishFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref DetectFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref CorridorFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref RankFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref AgentFunction}
      DefinitionSubstitutions:
        PublishArn: !GetAtt PublishFunction.Arn
        DetectArn: !GetAtt DetectFunction.Arn
        CorridorArn: !GetAtt CorridorFunction.Arn
        RankArn: !GetAtt RankFunction.Arn
        AgentArn: !GetAtt AgentFunction.Arn
      Definition:
        Comment: AERIS refresh - publish -> detect -> corridor -> rank -> agent. A failed step stops the run; gold/ keeps the last real result.
        StartAt: Publish
        States:
          Publish:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: {FunctionName: "${PublishArn}", Payload: {}}
            ResultSelector: {"result.$": "$.Payload"}
            ResultPath: $.publish
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 5
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Failed
            Next: Detect
          Detect:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: {FunctionName: "${DetectArn}", Payload: {}}
            ResultSelector: {"result.$": "$.Payload"}
            ResultPath: $.detect
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 5
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Failed
            Next: Corridor
          Corridor:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: {FunctionName: "${CorridorArn}", Payload: {}}
            ResultSelector: {"result.$": "$.Payload"}
            ResultPath: $.corridor
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 5
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Failed
            Next: Rank
          Rank:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: {FunctionName: "${RankArn}", Payload: {}}
            ResultSelector: {"result.$": "$.Payload"}
            ResultPath: $.rank
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 5
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Failed
            Next: Agent
          Agent:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: {FunctionName: "${AgentArn}", Payload: {}}
            ResultSelector: {"result.$": "$.Payload"}
            ResultPath: $.agent
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 5
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Failed
            Next: Done
          Done:
            Type: Succeed
          Failed:
            Type: Fail
            Error: PipelineStepFailed
            Cause: A pipeline step failed; gold/ still holds the last real result.
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            # FIRMS lands every 15 min; refresh the derived files every 30
            ScheduleExpression: rate(30 minutes)

  # --- API: gold/ -> API Gateway (HTTP API) --------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${WebDistribution.DomainName}
          - http://localhost:5173
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Content-Type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      RouteSettings:
        "POST /run":
          ThrottlingBurstLimit: 1
          ThrottlingRateLimit: 1

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambda/
      Handler: api.handlers.app.lambda_handler
      Role: !GetAtt ApiRole.Arn
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref PipelineStateMachine
      Events:
        Health: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /health}}
        Sources: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /sources}}
        Corridor: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /corridor}}
        Sites: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /sites}}
        RankedSites: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /ranked-sites}}
        SitesRanked: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /sites/ranked}}
        Actions: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /actions}}
        Stations: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /stations}}
        Aqi: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /aqi}}
        Wind: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /wind}}
        Fires: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /fires}}
        Summary: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /summary}}
        StartRun: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: POST, Path: /run}}
        RunStatus: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Method: GET, Path: "/run/{run_id}"}}

  # --- Website: CloudFront -> private web bucket (origin access control) ---
  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AERIS web
        DefaultRootObject: index.html
        HttpVersion: http2and3
        # North America, Europe, Asia incl. India - cheaper than PriceClass_All
        PriceClass: PriceClass_200
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # Single-page app: unknown paths fall back to index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  # --- Cost guard ---------------------------------------------------------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: aeris-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]

Outputs:
  ApiUrl:
    Description: API_BASE_URL for the web build
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  WebUrl:
    Value: !Sub https://${WebDistribution.DomainName}
  WebDistributionId: {Value: !Ref WebDistribution}
  PipelineStateMachineArn: {Value: !Ref PipelineStateMachine}
  FetchDlqUrl: {Value: !Ref FetchDlq}
  FetchDlqArn: {Value: !GetAtt FetchDlq.Arn}
  DataBucketName: {Value: !Ref DataBucket}
  WebBucketName: {Value: !Ref WebBucket}
  FetcherRoleArn: {Value: !GetAtt FetcherRole.Arn}
  ModelRoleArn: {Value: !GetAtt ModelRole.Arn}
  SageMakerRoleArn: {Value: !GetAtt SageMakerRole.Arn}
  AgentRoleArn: {Value: !GetAtt AgentRole.Arn}
  ApiRoleArn: {Value: !GetAtt ApiRole.Arn}
