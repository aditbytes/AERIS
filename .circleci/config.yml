version: 2.1

# The public repository can use CircleCI's no-card Free plan. Native ARM64
# matches the Lambda target, including pip's host-evaluated dependency markers.
executors:
  python312-arm64:
    docker:
      - image: python:3.12-bookworm
    resource_class: arm.medium
    working_directory: ~/aeris
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      SAM_CLI_TELEMETRY: "0"
      AWS_EC2_METADATA_DISABLED: "true"

commands:
  install-repository-dependencies:
    steps:
      - run:
          name: Verify Linux ARM64 CPython 3.12
          command: |
            python -c 'import platform, sys; print(sys.executable, sys.version, platform.machine()); assert sys.platform == "linux"; assert sys.implementation.name == "cpython"; assert sys.version_info[:2] == (3, 12); assert platform.machine().lower() in ("aarch64", "arm64")'
            make --version
      - run:
          name: Install declared repository dependencies
          command: python -m pip install -r requirements.txt
      - run:
          name: Check installed dependency consistency
          command: python -m pip check

jobs:
  python312-tests:
    executor: python312-arm64
    steps:
      - checkout
      - install-repository-dependencies
      - run:
          name: Run complete repository test suite
          command: python -m pytest -ra --junitxml=/tmp/aeris-test-results/pytest.xml
      - store_test_results:
          path: /tmp/aeris-test-results
      - run:
          name: Compile owned Python modules
          command: python -m compileall -q ingest models agent pipeline api scripts infra/lambda/prune.py

  lambda-package-verification:
    executor: python312-arm64
    steps:
      - checkout
      - install-repository-dependencies
      - run:
          name: Install SAM CLI separately from application dependencies
          command: |
            python -m venv /tmp/aeris-sam-cli
            /tmp/aeris-sam-cli/bin/python -m pip install aws-sam-cli
            /tmp/aeris-sam-cli/bin/python -m pip check
            /tmp/aeris-sam-cli/bin/sam --version
      - run:
          name: Stage runtime source files
          command: python scripts/stage_lambda_sources.py
      - run:
          name: Build actual configured Lambda artifacts without deploying
          command: /tmp/aeris-sam-cli/bin/sam build --template-file infra/template.yaml --build-dir .aws-sam/build
      - run:
          name: Enforce function plus layer uncompressed size limits
          command: python scripts/verify_lambda_dependencies.py --artifacts-dir .aws-sam/build --report .aws-sam/build/package-sizes.json
      - store_artifacts:
          path: .aws-sam/build/package-sizes.json
          destination: lambda-package-sizes.json

workflows:
  aeris-verification:
    # Both jobs are mandatory. No branch filters: pushes on PR branches also
    # run verification, including branches outside the feature/* convention.
    jobs:
      - python312-tests
      - lambda-package-verification
